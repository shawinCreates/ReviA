[project]
name = "endnote"
version = "0.1.0"
description = "EndNote backend: document ingestion, retrieval, and cited chat over Supabase."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "django>=6.1",
    "djangorestframework",
    "psycopg[binary]",
    "django-cors-headers",
    "pgvector",
    "python-dotenv",
    "httpx",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-django",
    "ruff",
]

# The backend is an application, not a distribution. Without this, uv tries to
# build the project on every sync and fails once there is no package to find.
[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = [".", "backend"]
testpaths = ["backend/api/tests"]
python_files = ["test_*.py"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# RUF012 wants mutable class attributes annotated as ClassVar. Django and DRF
# both read migrations, serializer Meta and view class attributes as plain
# lists, and annotating them would be noise that fights the frameworks.
"**/migrations/*.py" = ["RUF012"]
"**/serializers.py" = ["RUF012"]
"**/views.py" = ["RUF012"]
