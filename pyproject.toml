[project]
name = "revia"
version = "0.1.0"
description = "ReviA backend: document ingestion, retrieval, and cited chat over Supabase."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "gunicorn",
    "django>=6.1",
    "djangorestframework",
    "psycopg[binary]",
    "django-cors-headers",
    "pgvector",
    "python-dotenv",
    "httpx",
    # Supabase Storage is S3-compatible, and boto3 does multipart uploads and
    # range reads properly, which the ingestion step needs for large files.
    "boto3",
    # Document text extraction, one reader per allowed format. Chosen over bare
    # pdfminer/python-docx readers because it also classifies headings, which is
    # what lets the chunker cut on section boundaries. Heavy at install time, but
    # the chapters it saves are worth the disk.
    "unstructured[docx,pdf,pptx]>=0.27.25",
    # Vector normalisation and nearest-neighbour arithmetic. pgvector's Python
    # side already requires it, and the retrieval layer uses it directly.
    "numpy",
    # Direct pins so the CPU index below applies — torch arrives transitively
    # via unstructured-inference, and source pins only bind direct deps.
    "httpx",
    "torch",
    "torchvision",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-django",
    "ruff",
]

# The backend is an application, not a distribution. Without this, uv tries to
# build the project on every sync and fails once there is no package to find.
[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = [".", "backend"]
testpaths = ["backend/api/tests"]
python_files = ["test_*.py"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
# `api` and `config` are top-level packages inside backend/, not third-party
# code, and migrations import from them.
known-first-party = ["api", "config"]

[tool.ruff.lint.per-file-ignores]
# RUF012 wants mutable class attributes annotated as ClassVar. Django and DRF
# both read migrations, model Meta, serializer Meta and view class attributes as
# plain lists, and annotating them would be noise that fights the frameworks.
"**/migrations/*.py" = ["RUF012", "E501"]
"**/models.py" = ["RUF012"]
"**/serializers.py" = ["RUF012"]
"**/views.py" = ["RUF012"]

# This machine has no GPU: pin torch to CPU wheels so syncs never pull the
# multi-GB CUDA stack (nvidia-*, triton) requested by unstructured-inference.
# Remove if a GPU ever appears.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
